<head>
    <title>DigiMusTh</title>
    <meta charset="utf-8">
	<script src="{{site.baseurl}}/assets/js/CETEI.js"></script>
	<script src="{{site.baseurl}}/assets/js/verovio.js"></script>
		<!-- displaying math formulas-->
	<script> 
		MathJax = {
		tex: {
			inlineMath: {'[+]': [['$', '$']]} // adding the $ as a marker for formulas \( \) does also still work 
		},
		options: {
      enableMenu: false  // disables the context menu
      } 
		};
	</script>
	<script src="{{ site.baseurl }}/assets/js/mathjax/tex-mml-chtml.js"></script> <!--local-->
	<!--<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script> async version-->
  </head>

  <body>
	<div id="path" class="hidden">{{ page.name }}</div> <!-- needed for the following logic to identify the path -->
  	<!-- container for TEI document -->
    <div id="TEI"></div>
  	<!-- rendition -->
	
  	<script>
				
		var path = document.getElementById("path")
  		/* CETEIcean */
		var CETEIcean = new CETEI()

		/* deal with math elements*/
		CETEIcean.addBehaviors({
				
			"tei": {
				"formula": function(el) {
				// Create a wrapper element to hold raw content
				let wrapper = document.createElement("span");

				let rawContent = "";
				let serializer = new XMLSerializer();
				el.childNodes.forEach(child => {
				rawContent += serializer.serializeToString(child).replaceAll("ns1-", "");
				/*rawContent = rawContent.replace("ns1-", "");*/
					});
					wrapper.innerHTML = rawContent.replace("ns1-", "");
				return wrapper;
				},
			

		/* deal with facsimili css elements*/
				"hi": function(el) {
				let span = document.createElement("span");
	
				// Process rend attribute into CSS classes
				if (el.hasAttribute("rend")) {
					let rendValue = el.getAttribute("rend");

					// Parse rend into object
					let styles = rendValue.split(";").reduce((acc, pair) => {
					let [key, value] = pair.trim().split(":");
					if (key && value) acc[key.trim()] = value.trim();
					return acc;
					}, {});

					// Build class list from rend styles
					let classList = [];
					if (styles.letterSpaced === "true") classList.push("letterSpaced");
					if (styles.bold === "true") classList.push("bold");
					if (styles.superscript === "true") classList.push("superscript");

					if (styles.subscript === "true") classList.push("subscript");
					if (styles.italic === "true") classList.push("italic");

					if (classList.length) {
					span.className = classList.join(" ");
					}
				}

				// Append children
				while (el.firstChild) {
					span.appendChild(el.firstChild);
				}

				return span;
				}
			}
			});

			CETEIcean.getHTML5("../../data/" + path.innerHTML + "/" + path.innerHTML + ".xml", function(data) {
				/*CETEIcean.getHTML5("../../musicdata/tei/" + path.innerHTML, function(data) { */
			/* funktioniert: CETEIcean.getHTML5("../../musicdata/tei/" + "CAP1905_tei.xml", function(data) { */
			document.getElementById("TEI").appendChild(data)
			if (window.MathJax) {
						MathJax.typesetPromise(); // Tell MathJax to process newly inserted content
					}
			/*search parameter*/
			const query = new URLSearchParams(window.location.search).get("q");
		})
		/* Verovio */
		var vrvToolkit = new verovio.toolkit()
			vrvToolkit.setOptions(options = {
				pageHeight: 500,
				pageWidth: 1000,
				ignoreLayout: 1,
				border: 20,
				scale: 50,
				adjustPageHeight: true
		})
		/* DOM-Prüfer */
		function checkDOMAndProcess() {
		    const musicElements = document.querySelectorAll('tei-div[rend="MEI"]');
		    musicElements.forEach(node => {
		        if (node.getAttribute("source") && !node.dataset.processed) { // source war id ware "node.id"
		            node.dataset.processed = 'true'; // Verhindert doppelte Verarbeitung
		            const fileName = `${node.getAttribute("source")}`; // Dynamischer Dateiname basierend auf der ID  --- source war node.id
		            fetch("../../data/" + path.innerHTML + '/data' + `/${fileName}`) // path is here!
		                .then(response => response.text())
		                .then(data => {
		                    const svg = vrvToolkit.renderData(data, {});
		                    node.innerHTML = svg;
		                })
		                .catch(error => console.error('Error fetching MEI file:', error));
		        }
		    });
		    // Fordere den nächsten Frame an, um fortzufahren
		    requestAnimationFrame(checkDOMAndProcess);
		}
		// Starte die Überprüfung, sobald die DOM-Inhalte verfügbar sind
		document.addEventListener('DOMContentLoaded', checkDOMAndProcess);







		/*function for scrolling and highlighting, needs tidying up */
		
	window.addEventListener('DOMContentLoaded', () => {
			const hashParams = new URLSearchParams(window.location.hash.slice(1)); // remove the '#'

			// 1. Handle scrolling to facs target
			const facsValue = hashParams.get('facs');
			if (facsValue) {
				const decodedFacs = decodeURIComponent(facsValue);

				const scrollToTarget = (tries = 20) => {
				const el = document.querySelector(`[facs="${decodedFacs}"]`);
				if (!el) {
					// Element not yet in DOM → retry later
					if (tries > 0) setTimeout(() => scrollToTarget(tries - 1), 500);
					return;
				}

				// Scroll to it
				el.scrollIntoView({ behavior: 'smooth', block: 'center' });

				// Verify after a short delay whether it's really visible
				setTimeout(() => {
					const rect = el.getBoundingClientRect();
					const inView = rect.top >= 0 && rect.bottom <= window.innerHeight;

					if (!inView && tries > 0) {
					// Not fully visible → retry
					scrollToTarget(tries - 1);
					}
				}, 600);
				};

				scrollToTarget();
			}

			// 2. Highlight elements matching any other attributes
			for (const [key, value] of hashParams.entries()) {
				if (key !== 'facs' && key !== "q") {
				waitAndHighlight(key, decodeURIComponent(value));
				}
			}


			const query = new URLSearchParams(window.location.search).get("q");
			if (query) {
				waitAndTagTerm("#TEI tei-tei", query);
			}


			});

		// Reusable highlighter
		function highlightElements(attributeName, attributeValue, className = 'highlight') {
		const selector = `[${attributeName}="${attributeValue}"]`;
		console.log(`Trying to highlight: ${selector}`);

		const elements = document.querySelectorAll(selector);
		console.log(`Found ${elements.length} elements`);

		elements.forEach(el => {
			el.classList.add(className);
		});
	}

			function waitAndHighlight(attr, value, className = 'highlight', tries = 10) {
		const selector = `[${attr}="${value}"]`;
		const elements = document.querySelectorAll(selector);

		if (elements.length > 0) {
			elements.forEach(el => el.classList.add(className));
			console.log(`✅ Highlighted ${elements.length} element(s) for ${selector}`);
		} else if (tries > 0) {
			setTimeout(() => waitAndHighlight(attr, value, className, tries - 1), 300);
		} else {
			console.warn(`⚠️ Could not find elements for ${selector}`);
		}}
		
				
		function waitAndTagTerm(rootSelector, term, className = "highlight", tries = 10) {
		const container = document.querySelector(rootSelector);
		if (!container) {
			if (tries > 0) {
			setTimeout(() => waitAndTagTerm(rootSelector, term, className, tries - 1), 300);
			} else {
			console.warn(`⚠️ Container ${rootSelector} not found.`);
			}
			return;
		}

		let found = false;
		const safeTerm = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); // escape regex
		const regex = new RegExp(safeTerm, "gi");
		const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);

		let node;
		const nodesToReplace = [];

		// Collect nodes first (so we don't mutate while walking)
		while ((node = walker.nextNode())) {
			if (regex.test(node.nodeValue)) {
			nodesToReplace.push(node);
			}
		}

		// Replace in each node
		nodesToReplace.forEach((textNode) => {
			found = true;
			const wrapper = document.createElement("span");
			wrapper.innerHTML = textNode.nodeValue.replace(
			regex,
			`<span class="${className}">$&</span>`
			);
			textNode.parentNode.replaceChild(wrapper, textNode);
		});

		if (found) {
			console.log(`✅ Highlighted "${term}" in ${nodesToReplace.length} text node(s)`);
		} else if (tries > 0) {
			setTimeout(() => waitAndTagTerm(rootSelector, term, className, tries - 1), 300);
		} else {
			console.warn(`⚠️ Could not find term "${term}" after retries.`);
		}
		}

		function escapeRegExp(s) {
		return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
		}


	
</script>

</body>
