
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/presentation_css.css" />

<div class="stickyfoot">
  <div>
    <a id="page-indicator" href="#">Page ?</a>
    <div class="visualchanges_footer">
      Change the presentation of annotated items: 

      Authors and works
      <label class="switch">
        <input type="checkbox" class="toggle" data-func="stylepeople,styleworks">
        <span class="slider round peoplestyle"></span>
      </label>

      Concepts
      <label class="switch">
        <input type="checkbox" class="toggle" data-func="styleconcepts">
        <span class="slider round conceptstyle"></span>
      </label>

      Music
      <label class="switch">
        <input type="checkbox" class="toggle" data-func="stylemusic">
        <span class="slider round musicstyle"></span>
      </label>

      Locations and time 
      <label class="switch">
        <input type="checkbox" class="toggle" data-func="stylelocations,styletime">
        <span class="slider round timestyle"></span>
      </label>

      Check all
      <label class="switch"> 
        <input type="checkbox" id="checkAll">
        <span class="slider round"></span>
      </label>
    </div>

    <button onclick="topFunction()" id="topbutton" title="Go to top">Top</button> 
  </div>
</div>

<script>
  // --- Generic toggle helper ---
  function toggleClass(elements, className, force) {
    for (let item of elements) {
      if (force === true) {
        item.classList.add(className);
      } else if (force === false) {
        item.classList.remove(className);
      } else {
        item.classList.toggle(className);
      }
    }
  }

  // --- Style functions ---
  function stylepeople(force) {
    toggleClass(document.querySelectorAll("tei-persname[role='author'], tei-persname[role='composer']"), "peoplestyle", force);
  }

  function styleworks(force) {
    toggleClass(document.querySelectorAll("tei-title"), "workstyle", force);
  }

  function styleconcepts(force) {
    toggleClass(document.querySelectorAll("tei-rs[ana='#concept_phy'], tei-rs[ana='#concept_mus']"), "conceptstyle", force);
  }

  function stylelocations(force) {
    toggleClass(document.querySelectorAll("tei-placename"), "locationsstyle", force);
  }

  function styletime(force) {
    toggleClass(document.querySelectorAll("tei-date"), "timestyle", force);
  }

  function stylemusic(force) {
    toggleClass(document.querySelectorAll("tei-rs[ana='#m_note'], tei-rs[ana='#m_chord'], tei-rs[ana='#m_interval'], tei-rs[ana='#m_tonality']"), "musicstyle", force);
  }

  // --- Scroll-to-top function ---
  function topFunction() {
    document.body.scrollTop = 0; 
    document.documentElement.scrollTop = 0; 
  }

  // --- Checkbox logic ---
  const checkAllBox = document.getElementById('checkAll');
  const toggles = document.querySelectorAll('.toggle');

  // Individual toggles
  toggles.forEach(cb => {
    cb.addEventListener('change', () => {
      const funcs = cb.dataset.func.split(",");
      funcs.forEach(fn => window[fn.trim()](cb.checked));

      // Sync "Check all" if one is unchecked
      if (!cb.checked) {
        checkAllBox.checked = false;
      } else if ([...toggles].every(t => t.checked)) {
        checkAllBox.checked = true;
      }
    });
  });

  // Master toggle
  checkAllBox.addEventListener('change', function () {
    const checkAll = this.checked;
    toggles.forEach(cb => {
      cb.checked = checkAll;
      const funcs = cb.dataset.func.split(",");
      funcs.forEach(fn => window[fn.trim()](checkAll));
    });
  });

  // script for facsimilie linking and page number 
  window.PageIndicator = (function() {
  let pages = [];
  let facsMap = {};
  let indicator = null;
  let initialized = false;

  function init() {
    if (initialized) return; // prevent double init
    indicator = document.getElementById('page-indicator');
    if (!indicator) return;

    // Grab Pagebreakss after Ceteicean has loaded them
    pages = Array.from(document.querySelectorAll('[data-origname="pb"]'));
    console.log("Found PBs:", pages);

    if (pages.length === 0) return;

    // Build facsimile lookup 
    facsMap = {};
    document.querySelectorAll('[data-origname="facsimile"]').forEach(facs => {
      const graphic = facs.querySelector('[data-origname="graphic"]');
      if (graphic) facsMap[facs.id] = graphic.getAttribute('url');
    });
    //console.log("Facs map:", facsMap);

    // Initial update
    updatePageIndicator(getCurrentPageIndex());

    // Update on scroll + resize
    window.addEventListener('scroll', () => {
      updatePageIndicator(getCurrentPageIndex());
    });
    window.addEventListener('resize', () => {
      updatePageIndicator(getCurrentPageIndex());
    });

    initialized = true;
  }

  function updatePageIndicator(index) {
    const pb = pages[index];
    if (!pb) return;

    const facsId = pb.getAttribute('facs').replace('#', '');
    const url = facsMap[facsId];
    // e.g. "/texts/NAU1858/Naumann1858-0008.jpg"
    const filename = facsMap[facsId]; 

    // Get current page URL
    const currentUrl = window.location.href;

    // Extract the ID from the current URL
    const parts = currentUrl.split('/').filter(Boolean);

    const urlParts = window.location.pathname.split('/').filter(Boolean);
    const project = urlParts[0];  
    const id = urlParts[2];       


    // Build the new URL
    const newUrl = `${window.location.origin}/${project}/data/${id}/scans/${filename}`;

    const pageNum = pb.getAttribute('n') || (index + 1);

    indicator.textContent = `🕮 See facsimile of page ${pageNum}`;
    indicator.href = newUrl || "#";
    indicator.target = "_blank";
  }

  function getCurrentPageIndex() {
    const viewportMid = window.innerHeight / 2;
    let current = 0;
    for (let i = 0; i < pages.length; i++) {
      const rect = pages[i].getBoundingClientRect();
      if (rect.top < viewportMid) current = i;
    }
    return current;
  }

  // Watch for Ceteicean adding elements
  function watch() {
    const observer = new MutationObserver(() => {
      if (document.querySelector('[data-origname="pb"]')) {
        init();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  return { watch };
})();

// Start watching when DOM is ready
document.addEventListener('DOMContentLoaded', () => {
  PageIndicator.watch();
});
</script>
