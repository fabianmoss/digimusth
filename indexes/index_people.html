<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>People Index (TEI)</title>
  <style>
    .letter-heading {
      font-weight: bold;
      margin-top: 1em;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <ul id="personList"></ul>

  <script>
    async function loadXML(url) {
      const response = await fetch(url);
      const text = await response.text();
      return new window.DOMParser().parseFromString(text, "application/xml");
    }

    function parseTEI(xmlDoc) {
  const persons = [...xmlDoc.querySelectorAll("person")];
  return persons.map(p => {
    const id = p.getAttribute("xml:id") || "";

    const persName = p.querySelector("persName");
    const forename = persName?.querySelector("forename")?.textContent.trim() || "";
    const surname  = persName?.querySelector("surname")?.textContent.trim() || "";

    let name = "";
    if (surname && forename) {
      name = `${surname}, ${forename}`;  // "Surname, Forename"
    } else if (surname) {
      name = surname;
    } else if (forename) {
      name = forename;
    } else if (persName?.childNodes.length === 1 && persName.firstChild.nodeType === Node.TEXT_NODE) {
      // handle flat cases like <persName>Plato</persName>
      name = persName.textContent.trim();
    } else {
      name = "[Unnamed Person]";
    }

    const gnd = p.querySelector('idno[type="GND"]')?.textContent.trim() || "";
    return { id, name, gnd };
  });
}

    function createSortedList(data) {
      const list = document.getElementById("personList");
      list.innerHTML = "";

      // sort alphabetically
      data.sort((a, b) => a.name.localeCompare(b.name));

      let currentLetter = "";
      for (const person of data) {
        const firstLetter = person.name.trim().charAt(0).toUpperCase() || "#";

        if (firstLetter !== currentLetter) {
          currentLetter = firstLetter;
          const header = document.createElement("h5");
          header.className = "letter-heading";
          header.textContent = currentLetter;
          list.appendChild(header);
        }

        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = `../index_result_people?person=${person.id}`;
        a.textContent = person.name;
        li.appendChild(a);
        list.appendChild(li);
      }
    }

    // Main
    (async function () {
      const xmlDoc = await loadXML('../people.xml'); // file is in same folder as this HTML
      const people = parseTEI(xmlDoc);
      createSortedList(people);
    })();
  </script>
</body>
</html>
